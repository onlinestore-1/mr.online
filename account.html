<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f1f3f6;
}

/* HEADER */
.header {
  background: #fff;
  padding: 15px;
  font-size: 20px;
  font-weight: bold;
  display: flex;
  align-items: center;
}

/* SECTION */
.section {
  background: #fff;
  margin-top: 10px;
  padding: 15px;
}

/* PRODUCTS ROW */
.products {
  display: flex;
  overflow-x: auto;
  gap: 10px;
}

.product {
  min-width: 100px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  text-align: center;
  padding: 10px;
  cursor: pointer;
}

.product img {
  width: 80px;
  height: 80px;
  object-fit: cover;
}

/* LANGUAGE BUTTONS */
.lang-btn {
  border: 1px solid #ccc;
  padding: 6px 12px;
  border-radius: 20px;
  margin-right: 10px;
  cursor: pointer;
}

/* LIST ITEMS */
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid #eee;
  cursor: pointer;
}

.list-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.footer {
  background: #fff;
  margin-top: 10px;
  padding: 15px;
}

.footer div {
  padding: 8px 0;
  cursor: pointer;
}
</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
  <i class="fa fa-arrow-left"></i>&nbsp; <span id="accountText">Account</span>
</div>

<!-- RECENTLY VIEWED -->
<div class="section">
  <h3 id="recentText">Recently Viewed Stores</h3>

  <div class="products" id="recentProducts"></div>
</div>

<!-- LANGUAGE -->
<div class="section">
  <h3 id="langTitle">Try Plus+ Online in your language</h3>

  <span class="lang-btn" onclick="setLanguage('sw')">Swahili</span>
  <span class="lang-btn" onclick="setLanguage('en')">English</span>
</div>

<!-- ACCOUNT SETTINGS -->
<div class="section">
  <h3 id="settingsText">Account Settings</h3>

  <div class="list-item" onclick="location.href='language.html'">
    <div class="list-left">
      <i class="fa fa-language"></i>
      <span id="selectLang">Select Language</span>
    </div>
    <i class="fa fa-chevron-right"></i>
  </div>

  <div class="list-item" onclick="location.href='notifications.html'">
    <div class="list-left">
      <i class="fa fa-bell"></i>
      <span id="notifyText">Notification Settings</span>
    </div>
    <i class="fa fa-chevron-right"></i>
  </div>

  <div class="list-item" onclick="location.href='help.html'">
    <div class="list-left">
      <i class="fa fa-headset"></i>
      <span id="helpText">Help Center</span>
    </div>
    <i class="fa fa-chevron-right"></i>
  </div>
</div>

<!-- EARN -->
<div class="section">
  <h3 id="earnText">Earn with Plus+ Online</h3>

  <div class="list-item" onclick="location.href='sell.html'">
    <div class="list-left">
      <i class="fa fa-store"></i>
      <span id="sellText">Sell on Plus+ Online</span>
    </div>
    <i class="fa fa-chevron-right"></i>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <div onclick="location.href='terms.html'" id="termsText">Terms</div>
  <div onclick="location.href='policies.html'" id="policyText">Policies</div>
  <div onclick="location.href='faq.html'" id="faqText">Browse FAQs</div>
</div>

<script>
/* =========================
   RECENTLY VIEWED PRODUCTS
========================= */
const products = [
  {img:"https://via.placeholder.com/80", name:"Item 1"},
  {img:"https://via.placeholder.com/80", name:"Item 2"},
  {img:"https://via.placeholder.com/80", name:"Item 3"},
  {img:"https://via.placeholder.com/80", name:"Item 4"},
  {img:"https://via.placeholder.com/80", name:"Item 5"},
  {img:"https://via.placeholder.com/80", name:"Item 6"},
  {img:"https://via.placeholder.com/80", name:"Item 7"},
  {img:"https://via.placeholder.com/80", name:"Item 8"},
  {img:"https://via.placeholder.com/80", name:"Item 9"},
  {img:"https://via.placeholder.com/80", name:"Item 10"}
];

const container = document.getElementById("recentProducts");

function loadProducts(){
  container.innerHTML = "";
  products.forEach(p=>{
    const div = document.createElement("div");
    div.className = "product";
    div.innerHTML = `
      <img src="${p.img}">
      <div>${p.name}</div>
    `;
    div.onclick = ()=>location.href="product.html";
    container.appendChild(div);
  });
}
loadProducts();

/* =========================
   LANGUAGE SWITCH
========================= */
function setLanguage(lang){
  if(lang === "sw"){
    document.getElementById("accountText").innerText = "Akaunti";
    document.getElementById("recentText").innerText = "Uliyotazama Hivi Karibuni";
    document.getElementById("langTitle").innerText = "Jaribu Plus+ Online kwa lugha yako";
    document.getElementById("settingsText").innerText = "Mipangilio ya Akaunti";
    document.getElementById("selectLang").innerText = "Chagua Lugha";
    document.getElementById("notifyText").innerText = "Mipangilio ya Taarifa";
    document.getElementById("helpText").innerText = "Kituo cha Msaada";
    document.getElementById("earnText").innerText = "Pata na Plus+ Online";
    document.getElementById("sellText").innerText = "Uza kwenye Plus+ Online";
    document.getElementById("termsText").innerText = "Masharti";
    document.getElementById("policyText").innerText = "Sera";
    document.getElementById("faqText").innerText = "Maswali";
  } else {
    location.reload(); // reset to English
  }
}
</script>

</body>
</html>
