<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fashion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}

/* TOP */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 background:#2874f0;
 padding:10px;
 color:#fff
}
.top input{flex:1;padding:8px;border:none;border-radius:4px}
.cart{font-size:22px;cursor:pointer}

/* SLIDER */
.slider img{width:100%;display:none}
.slider img:first-child{display:block}

/* CATEGORY GRID */
.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:10px
}
.cat{
 background:#fff;
 padding:10px;
 text-align:center;
 border-radius:6px;
 cursor:pointer
}
.cat img{width:100%;height:90px;object-fit:cover}

/* TOP DEALS SECTION */
.deal-title{
  background:orange;
  color:white;
  padding:10px;
  margin:0;
  border-left:6px solid #2874f0;
}

.deal-wrapper{
  background:orange;
  padding:10px;
}

.deal-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.deal-card{
  background:#fff;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
}

.deal-card img{
  width:100%;
  height:140px;
  object-fit:cover;
} 

/* PRODUCTS */
.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:10px
}
.card{
 background:#fff;
 padding:10px;
 border-radius:6px
}
.card img{width:100%}
</style>
</head>

<body>

<div class="top">
 <input type="search" placeholder="Search fashion..." onkeyup="search(this.value)">
 <span class="cart" onclick="location.href='cart.html'">🛒</span>
</div>

<!-- ADS -->
<div class="slider">
 <img src="https://i.imgur.com/j6JWI5n.png">
 <img src="https://i.imgur.com/3ZFgqAY.png">
 <img src="https://i.imgur.com/M4bTgH1.png">
</div>

<h3 style="padding:10px">Fashion Categories</h3>

<div class="grid3">
 <div class="cat" onclick="openType('tshirt')"><img src="https://i.imgur.com/AXqovl6.jpeg"><p>T-Shirts</p></div>
 <div class="cat" onclick="openType('jeans')"><img src="https://i.imgur.com/F9T6D7U.jpeg"><p>Jeans</p></div>
 <div class="cat" onclick="openType('sunglasses')"><img src="https://i.imgur.com/LLWgym8.jpeg"><p>Sunglasses</p></div>
 <div class="cat" onclick="openType('gloves')"><img src="https://i.imgur.com/eDemSjj.jpeg"><p>Gloves</p></div>
 <div class="cat" onclick="openType('kids')"><img src="https://i.imgur.com/Hwv8eiw.jpeg"><p>Kofia</p></div>
 <div class="cat" onclick="openType('sports')"><img src="https://i.imgur.com/ALj8i2X.jpeg"><p>Shoes</p></div>
</div>

<h3 class="deal-title">Top Deals Of The Week</h3>

<div class="deal-wrapper">
  <div class="deal-grid" id="topDeals"></div>
</div>

<div class="grid2" id="topDeals"></div>

<h3 style="padding:10px">Suggested For You</h3>
<div class="grid2" id="suggested"></div>

<h3 style="padding:10px">You May Also Like</h3>
<div class="grid2" id="like"></div>

<script>
/* SLIDER */
let s=0;
setInterval(()=>{
 let imgs=document.querySelectorAll(".slider img");
 imgs.forEach(i=>i.style.display="none");
 s=(s+1)%imgs.length;
 imgs[s].style.display="block";
},3000);

/* FASHION DATA */
const fashion=[
 {id:101,name:"Blue T-Shirt",price:12,img:"https://i.imgur.com/M7lVvkH.jpeg",type:"tshirt",desc:"Men Washed Relaxed Fit Crew" },
 {id:102,name:"NEONOMAD",price:14,img:"https://i.imgur.com/QlgHGCQ.jpeg",type:"tshirt",desc:"Men Embroidered Regular Fit"},
 {id:103,name:"Blue Jeans",price:25,img:"https://i.imgur.com/QZ8B1VC.jpeg",type:"jeans"},
 {id:104,name:"Sneakers",price:40,img:"https://i.imgur.com/YU7yVMc.jpeg",type:"sneakers"},
 {id:105,name:"TECHNOSPORT",price:13000,img:"https://i.imgur.com/EptkNxj.jpeg",type:"tshirt",desc:"Men Slim Fit T Shirt"},
 {id:106,name:"Buda Jeans Co",price:10000,img:"https://i.imgur.com/DuPhNKu.jpeg",type:"tshirt",desc:"Men Graphic Print Regular Fit"},
 {id:107,name:"Alfaq",price:15000,img:"https://i.imgur.com/unw4MV3.jpeg",type:"tshirt",desc:"Men Graphic Print Oversized"},
 {id:108,name:"Neonomad",price:12000,img:"https://i.imgur.com/zgyFKOe.jpeg",type:"tshirt",desc:"Men Graphic Print Oversized"},
 {id:109,name:"Neonomad",price:12500,img:"https://i.imgur.com/tpYrddJ.jpeg",type:"tshirt",desc:"Men Graphic Print Oversized"},
 {id:110,name:"Buda Jeans Co",price:12500,img:"https://i.imgur.com/bBde034.jpeg",type:"tshirt",desc:"Men Graphic Oversized Fit"},
 {id:111,name:"Neonomad",price:12000,img:"https://i.imgur.com/NDAoZAr.jpeg",type:"tshirt",desc:"Men Graphic Print Oversized Fit"},
 {id:112,name:"Buda Jeans Co",price:12000,img:"https://i.imgur.com/SSMbMl6.jpeg",type:"tshirt",desc:"Men Graphic Print Oversized Fit"}
];

 /* TOP DEALS DATA */
const topDeals = [
 {id:201,name:"OnePlus Nord 5",price:32499,img:"https://i.imgur.com/DKQ0LxO.jpeg",desc:"Fast 5G smartphone"},
 {id:202,name:"iQOO Z10R",price:19999,img:"https://i.imgur.com/6ZJ4nZy.jpeg",desc:"Powerful camera phone"},
 {id:203,name:"Samsung M17",price:13999,img:"https://i.imgur.com/VZ9z9lL.jpeg",desc:"50MP no shake camera"},
 {id:204,name:"OnePlus 13S",price:47999,img:"https://i.imgur.com/jxZpFfK.jpeg",desc:"Premium flagship phone"},
 {id:103,name:"Blue Jeans",price:25,img:"https://i.imgur.com/QZ8B1VC.jpeg",type:"jeans"},
 {id:28,name:"OMO",price:18,img:"https://i.imgur.com/v0eeorr.jpeg",type:"sabuni",desc:"Ondoa madoa sugu"}
];

 let allProducts = JSON.parse(localStorage.getItem("allProducts")) || [];

// Merge without duplicates
topDeals.forEach(d=>{
 if(!allProducts.some(p=>p.id===d.id)){
   allProducts.push(d);
 }
});

localStorage.setItem("allProducts", JSON.stringify(allProducts));

localStorage.setItem("allProducts",JSON.stringify(fashion));

 function formatPrice(price){
  return "TZS " + Number(price).toLocaleString() + "/=";
}

function draw(list,id){
 document.getElementById(id).innerHTML=list.map(p=>`
  <div class="card" onclick="openProduct(${p.id})">
   <img src="${p.img}">
   <p>${p.name}</p>
   <b>${formatPrice(p.price)}</b>
  </div>`).join("");
}

 function drawTopDeals(){
 document.getElementById("topDeals").innerHTML =
  topDeals.map(p=>`
   <div class="card" onclick="openProduct(${p.id})">
    <img src="${p.img}">
    <p>${p.name}</p>
    <b>TZS ${Number(p.price).toLocaleString()}/=</b>
   </div>
  `).join("");
}

drawTopDeals();

draw(fashion.slice(0,2),"suggested");
draw(fashion.slice(1),"like");

function openType(t){
 localStorage.setItem("fashionType",t);
 location.href="fashion-list.html";
}

function openProduct(id){
 localStorage.setItem("pid",id);
 location.href="product.html";
}

function search(v){
 draw(fashion.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())),"suggested");
}
</script>

</body>
</html>
