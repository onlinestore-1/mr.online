<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Home uses</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}

/* TOP */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 background:#2874f0;
 padding:10px;
 color:#fff
}
.top input{flex:1;padding:8px;border:none;border-radius:4px}
.cart{font-size:22px;cursor:pointer}

/* SLIDER */
.slider img{width:100%;display:none}
.slider img:first-child{display:block}

/* CATEGORY GRID */
.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:10px
}
.cat{
 background:#fff;
 padding:10px;
 text-align:center;
 border-radius:6px;
 cursor:pointer
}
.cat img{width:100%;height:90px;object-fit:cover}

/* PRODUCTS */
.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:10px
}
.card{
 background:#fff;
 padding:10px;
 border-radius:6px
}
.card img{width:100%}
</style>
</head>

<body>

<div class="top">
 <input type="search" placeholder="Search muhimu..." onkeyup="search(this.value)">
 <span class="cart" onclick="location.href='cart.html'">🛒</span>
</div>

<!-- ADS -->
<div class="slider">
 <img src="https://i.imgur.com/j6JWI5n.png">
 <img src="https://i.imgur.com/3ZFgqAY.png">
 <img src="https://i.imgur.com/M4bTgH1.png">
</div>

<h3 style="padding:10px">Fashion Categories</h3>

<div class="grid3">
 <div class="cat" onclick="openType('sabuni')"><img src="https://i.postimg.cc/52JB1cfY/muh7.jpg"><p>Sabuni</p></div>
 <div class="cat" onclick="openType('book')"><img src="https://i.postimg.cc/pT5hzkP0/muh1.jpg"><p>Madaftari</p></div>
 <div class="cat" onclick="openType('tooth')"><img src="https://i.postimg.cc/2547hzTB/a1.jpg"><p>Dawa ya meno</p></div>
 <div class="cat" onclick="openType('oil')"><img src="https://i.postimg.cc/tR2QFbMQ/muh29.jpg"><p>Mafuta</p></div>
 <div class="cat" onclick="openType('kids')"><img src="https://i.postimg.cc/nrssK2Z0/kia10.jpg"><p>Kids Shoes</p></div>
 <div class="cat" onclick="openType('ziada')"><img src="https://i.postimg.cc/T3PPnQ92/crocs2.jpg"><p>Ziada</p></div>
</div>

<h3 style="padding:10px">Suggested For You</h3>
<div class="grid2" id="suggested"></div>

<h3 style="padding:10px">You May Also Like</h3>
<div class="grid2" id="like"></div>

<script>
/* SLIDER */
let s=0;
setInterval(()=>{
 let imgs=document.querySelectorAll(".slider img");
 imgs.forEach(i=>i.style.display="none");
 s=(s+1)%imgs.length;
 imgs[s].style.display="block";
},3000);

/* FASHION DATA */
const fashion=[
 {id:101,name:"Doffi",price:12,img:"https://i.imgur.com/wpJjs0L.jpeg",type:"sabuni"},
 {id:28,name:"OMO",price:18,img:"https://i.imgur.com/v0eeorr.jpeg",type:"sabuni",desc:"Ondoa madoa sugu"},
 {id:19,name:"Doffi",price:17,img:"https://i.imgur.com/hD9g7L2.jpeg/200",desc:"Washing powder"},
 {id:29,name:"Niceone",price:18,img:"https://i.imgur.com/7nmPGbq.jpeg/200",type:"sabuni",desc:"Ondoa madoa sugu"},
 {id:20,name:"Jet",price:19,img:"https://i.imgur.com/OoGiHtj.jpeg",type:"sabuni",desc:"Dish washing liquid soap"},
 {id:21,name:"Jet",price:18,img:"https://i.imgur.com/q36RjQ2.jpeg",type:"sabuni",desc:"Dish washing liquid soap"},
 {id:102,name:"White T-Shirt",price:14,img:"https://i.imgur.com/F9T6D7U.jpeg",type:"book"},
 {id:103,name:"Blue Jeans",price:25,img:"https://i.imgur.com/QZ8B1VC.jpeg",type:"oil"},
 {id:35,name:"Exercise Book",price:19,img:"https://i.imgur.com/AQrSAGW.jpeg/200",type:"book",desc:"Daftari mistali mikubwa na midogo"},
 {id:36,name:"Exercise Book",price:19,img:"https://i.imgur.com/ihIcg3h.jpeg/200",type:"book",desc:"Daftari la kuandikia page 100"},
 {id:37,name:"Exercise Book",price:17,img:"https://i.imgur.com/Hg8Aeea.jpeg/200",type:"book",desc:"Daftari la kuandikia page 32"},
 {id:104,name:"Sneakers",price:40,img:"https://i.imgur.com/YU7yVMc.jpeg",type:"kids"},
 {id:99,name:"Colgate",price:17,img:"https://i.postimg.cc/2547hzTB/a1.jpg/200",type:"tooth",desc:"With The Cool Mint Flavour"},
 {id:98,name:"Crocs",price:17,img:"https://i.postimg.cc/T3PPnQ92/crocs2.jpg/200",type:"ziada",desc:"Crocs"},
 {id:97,name:"Shoes",price:17,img:"https://i.postimg.cc/gJh5cB3N/a15.jpg/200",type:"kids",desc:"Viatu vya watoto wadogo"},
 {id:96,name:"Shoes",price:17,img:"https://i.postimg.cc/kGncrjsW/a16.jpg/200",type:"kids",desc:"Viatu vya watoto wadogo"},
 {id:95,name:"Shoes",price:17,img:"https://i.postimg.cc/sxXh9bws/a13.jpg/200",type:"kids",desc:"Viatu vya watoto wadogo"}
];

localStorage.setItem("allProducts",JSON.stringify(fashion));

 function formatPrice(price){
  return "TZS " + Number(price).toLocaleString() + "/=";
}

function draw(list,id){
 document.getElementById(id).innerHTML=list.map(p=>`
  <div class="card" onclick="openProduct(${p.id})">
   <img src="${p.img}">
   <p>${p.name}</p>
   <b>${formatPrice(p.price)}</b>
  </div>`).join("");
}

draw(fashion.slice(0,2),"suggested");
draw(fashion.slice(1),"like");

function openType(t){
 localStorage.setItem("fashionType",t);
 location.href="fashion-list.html";
}

function openProduct(id){
 localStorage.setItem("pid",id);
 location.href="product.html";
}

function search(v){
 draw(fashion.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())),"suggested");
}
</script>

</body>
</html>
