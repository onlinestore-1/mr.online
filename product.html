 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Product</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;margin:0;background:#f4f4f4}
.main-img img{width:100%}
.thumbs{display:flex;gap:10px;padding:10px}
.thumbs img{width:70px;border:2px solid #ccc;cursor:pointer}
.buy{background:#ff9f00;border:none;width:100%;padding:12px;font-size:16px}
</style>
</head>

<body>

<div class="main-img">
 <img id="bigImg" src="https://i.imgur.com/5sZ4FvA.jpeg">
</div>

<div class="thumbs">
 <img src="https://i.imgur.com/5sZ4FvA.jpeg" onclick="changeImg(this.src)">
 <img src="https://i.imgur.com/7wZ6XZm.jpeg" onclick="changeImg(this.src)">
 <img src="https://i.imgur.com/6X0n5yA.jpeg" onclick="changeImg(this.src)">
</div>

<h3>Spin Mop Set</h3>
<p>Durable mop with strong handle</p>
<b>$25</b>

<button class="buy">Add to Cart</button>

<script>
function changeImg(src){
 document.getElementById("bigImg").src = src;
}
</script>

</body>
</html>
