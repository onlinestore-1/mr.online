 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      padding:15px;
    }

    .card{
      background:#fff;
      padding:15px;
      border-radius:8px;
    }

    img{
      width:100%;
      border-radius:6px;
    }

    h2{
      margin:10px 0 5px;
    }

    button{
      width:100%;
      padding:10px;
      margin-top:8px;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }

    .buy{background:#ff9f00;}
    .cart{background:#2874f0;color:white;}

    input{width:60px;padding:5px;font-size:16px;}

    /* YOU MAY ALSO LIKE */
    h3{margin-top:25px;}

    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }

    .mini{
      background:#fff;
      padding:10px;
      border-radius:6px;
      cursor:pointer;
    }

    .mini img{
      width:100%;
      height:120px;
      object-fit:cover;
    }

    .mini p{
      margin:5px 0;
      font-size:14px;
    }
  </style>
</head>

<body>

 <div class="discount-card" onclick="openProduct(41)">

<div class="card" id="productBox"></div>

<h3>You May Also Like</h3>
<div class="grid" id="likeBox"></div>

 <script>
/* LOAD PRODUCTS */
const products = JSON.parse(localStorage.getItem("allProducts")) || [];
const pid = localStorage.getItem("pid");

/* SAFETY CHECK */
if(!pid || products.length === 0){
  alert("Product not found");
  location.href = "index.html";
}

/* FIND PRODUCT */
const p = products.find(x => x.id == pid);
if(!p){
  alert("Product not found");
  location.href = "index.html";
}

/* MAIN PRODUCT */
document.getElementById("productBox").innerHTML = `
  <img src="${p.img}">
  <h2>${p.name}</h2>
  <p>${p.desc}</p>
  <b>$${p.price}</b><br><br>

  Qty:
  <input id="qty" type="number" value="1" min="1"><br><br>

  <button class="buy" onclick="buy()">Buy Now</button>
  <button class="cart" onclick="addCart()">Add to Cart</button>
`;

/* YOU MAY ALSO LIKE */
const likeBox = document.getElementById("likeBox");
products
  .filter(x => x.id != pid)
  .slice(0,6)
  .forEach(p2 => {
    likeBox.innerHTML += `
      <div class="mini" onclick="openProduct(${p2.id})">
        <img src="${p2.img}">
        <p>${p2.name}</p>
        <b>$${p2.price}</b>
      </div>
    `;
  });

function openProduct(id){
  localStorage.setItem("pid", id);
  location.reload();
}

function buy(){
  const qty = parseInt(document.getElementById("qty").value) || 1;
  localStorage.setItem("buy", JSON.stringify({...p, qty}));
  location.href = "checkout.html";
}

function addCart(){
  const qty = parseInt(document.getElementById("qty").value) || 1;
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  cart.push({...p, qty});
  localStorage.setItem("cart", JSON.stringify(cart));
  alert("Added to cart ✅");
}
</script>

</body>
</html>
