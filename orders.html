<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      padding:10px;
    }

    header{
      background:#2874f0;
      color:white;
      padding:12px;
      text-align:center;
      font-size:18px;
    }

    .orders{
      max-width:600px;
      margin:auto;
    }

    .order{
      background:#fff;
      padding:10px;
      margin:10px 0;
      border-radius:8px;
      display:flex;
      gap:10px;
      align-items:center;
      cursor:pointer;
    }

    .order img{
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:6px;
    }

    .order-name{
      font-size:16px;
      font-weight:bold;
    }

    .empty{
      text-align:center;
      margin-top:40px;
      color:#777;
    }

  .mini{
  min-width:140px; /* controls card size */
  background:#fff;
  padding:10px;
  border-radius:6px;
  cursor:pointer;
  flex-shrink:0; /* prevents shrinking */
}

 .grid{
  display:flex;
  overflow-x:auto;
  gap:10px;
  padding-bottom:10px;
  scroll-behavior:smooth;
}

.grid::-webkit-scrollbar{
  display:none; /* hide scrollbar */
} 
  </style>
</head>

<body>

  <div class="topbar">
  <span onclick="history.back()" style="font-size:22px;cursor:pointer;">←</span>

  <h3 class="title">Continue Your Shopping</h3>

  <span style="font-size:20px;cursor:pointer;">🔍</span>
  <span class="cart" onclick="location.href='cart.html'">🛒</span>
</div>

<header>My Orders</header>

<div class="orders" id="ordersBox"></div>

<!-- SIMILAR PRODUCTS -->
<h3 class="section-title">Similar Products</h3>
<div id="similar" class="scroll-row"></div>

<!-- EXPLORE SIMILAR TRENDS -->
<h3 class="section-title">Explore Similar Trends</h3>
<div id="trending" class="scroll-row"></div>

<script>
const speakers = [ 
 {id:409,name:"Small Speaker",price:25,img:"https://i.postimg.cc/DwMMYkjL/aa86.jpg",type:"power",desc:"Small Bluetooth Speaker"},
 {id:407,name:"Small Speaker",price:25,img:"https://i.postimg.cc/j2H3TfLz/aa85.jpg",type:"power",desc:"Small Bluetooth Speaker"},
 {id:408,name:"ZEBRONICS Astra",price:25,img:"https://i.postimg.cc/rFyNs3Hv/aa81.jpg",type:"power",desc:"Portable Bluetooth Speaker"},
 {id:410,name:"ZEBRONICS Sound",price:25,img:"https://i.postimg.cc/FsQsxQm4/aa83.jpg",type:"power",desc:"Zebronics Sound Feast50"},
 {id:411,name:"Motorola Moto",price:40,img:"https://i.postimg.cc/nL965CYk/a37.jpg",type:"charger",desc:"Buds Loop TWS"},
 {id:110,name:"Cherry Bar",price:13,img:"https://i.imgur.com/QZ8B1VC.jpeg/200",type:"cream",desc:"Cherry flavoured ice bar"},
 {id:111,name:"Caramello",price:13,img:"https://i.imgur.com/HgeHJvR.jpeg/200",type:"cream",desc:"Caramello flavoured ice cream"},
 {id:112,name:"Coca Cola",price:23,img:"https://i.imgur.com/UYZ1dIH.jpeg/200",type:"drinks",desc:"Coca Cola"},
 {id:200,name:"Doffi",price:12,img:"https://i.imgur.com/wpJjs0L.jpeg",type:"sabuni"}
];
  
let orders = JSON.parse(localStorage.getItem("orders")) || [];
const box = document.getElementById("ordersBox");

if(orders.length === 0){
  box.innerHTML = `
    <div class="empty">
      <p>No orders yet</p>
    </div>
  `;
}

orders.forEach(o => {
  box.innerHTML += `
    <div class="order" onclick="rebuy(${o.id})">
      <img src="${o.img}">
      <div class="order-name">${o.name}</div>
    </div>
  `;
});

function rebuy(id){
  localStorage.setItem("pid", id);
  location.href = "product.html";
}

function drawSimilar(){

 let shuffled = [...speakers].sort(()=>0.5 - Math.random());

 document.getElementById("similar").innerHTML =
  shuffled.slice(0,7).map(p=>`
   <div class="scroll-card" onclick="openProduct(${p.id})">
    <img src="${p.img}">
    <p>${p.name}</p>
    <b>${formatPrice(p.price)}</b>
   </div>
  `).join("");
}

function drawTrending(){

 let shuffled = [...speakers].sort(()=>0.5 - Math.random());

 document.getElementById("trending").innerHTML =
  shuffled.slice(0,6).map(p=>`
   <div class="scroll-card" onclick="openProduct(${p.id})">
    <img src="${p.img}">
    <p>${p.name}</p>
    <b>${formatPrice(p.price)}</b>
   </div>
  `).join("");
}

drawSimilar();
drawTrending();

/* AUTO UPDATE */
setInterval(()=>{
 drawSimilar();
 drawTrending();
},5000);
</script>

</body>
</html>
