<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Speakers</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:6px}
.card img{width:100%}
</style>
</head>

<body>

<h2 style="padding:10px">Speakers</h2>
<div id="box" class="grid"></div>

<script>
const speakers = [
 {id:101,name:"Mini Boost",price:35,img:"https://i.imgur.com/DKQ0LxO.jpeg",desc:"Portable speaker",cat:"Speakers"},
 {id:102,name:"Samsung Mix",price:55,img:"https://i.imgur.com/6ZJ4nZy.jpeg",desc:"Deep bass speaker",cat:"Speakers"},
 {id:103,name:"Fitric M3",price:42,img:"https://i.imgur.com/VZ9z9lL.jpeg",desc:"Wireless speaker",cat:"Speakers"},
 {id:104,name:"JBL Go",price:38,img:"https://i.imgur.com/jxZpFfK.jpeg",desc:"Mini powerful sound",cat:"Speakers"},
 {id:10,name:"Royco",price:14,img:"https://i.imgur.com/rmXvXwO.jpeg/200",cat:"Chakula & afya",desc:"Royco mchuzi mix"},
 {id:3,name:"Sukari 1kg",price:30,img:"https://i.imgur.com/1EFgnRl.jpeg",type:"sukari"}
];

// LOAD EXISTING PRODUCTS
let all = JSON.parse(localStorage.getItem("allProducts")) || [];

// MERGE WITHOUT DUPLICATES
speakers.forEach(sp => {
  if (!all.some(p => p.id === sp.id)) {
    all.push(sp);
  }
});

// SAVE ONCE
localStorage.setItem("allProducts", JSON.stringify(all));

// DISPLAY SPEAKERS
document.getElementById("box").innerHTML = speakers.map(p=>`
 <div class="card" onclick="openProduct(${p.id})">
  <img src="${p.img}">
  <p>${p.name}</p>
  <b>$${p.price}</b>
 </div>
`).join("");

function openProduct(id){
 localStorage.setItem("pid", id);
 location.href = "product.html";
}
</script>

</body>
</html>
