<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chakula & afya</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}

/* TOP */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 background:#2874f0;
 padding:10px;
 color:#fff
}
.top input{flex:1;padding:8px;border:none;border-radius:4px}
.cart{font-size:22px;cursor:pointer}

/* SLIDER */
.slider img{width:100%;display:none}
.slider img:first-child{display:block}

/* CATEGORY GRID */
.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:10px
}
.cat{
 background:#fff;
 padding:10px;
 text-align:center;
 border-radius:6px;
 cursor:pointer
}
.cat img{width:100%;height:90px;object-fit:cover}

/* PRODUCTS */
.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:10px
}
.card{
 background:#fff;
 padding:10px;
 border-radius:6px
}
.card img{width:100%}
</style>
</head>

<body>

<div class="top">
 <input type="search" placeholder="Search chakula..." onkeyup="search(this.value)">
 <span class="cart" onclick="location.href='cart.html'">🛒</span>
</div>

<!-- ADS -->
<div class="slider">
 <img src="https://i.imgur.com/j6JWI5n.png">
 <img src="https://i.imgur.com/3ZFgqAY.png">
 <img src="https://i.imgur.com/M4bTgH1.png">
</div>

<h3 style="padding:10px">Chakula & afya Categories</h3>

<div class="grid3">
 <div class="cat" onclick="openType('mafuta')"><img src="https://i.imgur.com/g3hVvcA.jpeg"><p>Mafuta</p></div>
 <div class="cat" onclick="openType('sukari')"><img src="https://i.imgur.com/1EFgnRl.jpeg"><p>Sukari</p></div>
 <div class="cat" onclick="openType('masala')"><img src="https://i.imgur.com/VZhUC4y.jpeg"><p>Masala</p></div>
 <div class="cat" onclick="openType('cream')"><img src="https://i.imgur.com/ZOoBodH.jpeg"><p>Ice cream</p></div>
 <div class="cat" onclick="openType('drinks')"><img src="https://i.imgur.com/FClIGHc.jpeg"><p>Cold Drinks</p></div>
 <div class="cat" onclick="openType('extra')"><img src="https://i.imgur.com/PkpHfpZ.jpeg"><p>Mengineyo</p></div>
</div>

<h3 style="padding:10px">Suggested For You</h3>
<div class="grid2" id="suggested"></div>

<h3 style="padding:10px">You May Also Like</h3>
<div class="grid2" id="like"></div>

<script>
/* SLIDER */
let s=0;
setInterval(()=>{
 let imgs=document.querySelectorAll(".slider img");
 imgs.forEach(i=>i.style.display="none");
 s=(s+1)%imgs.length;
 imgs[s].style.display="block";
},3000);

/* FASHION DATA */
const fashion=[
 {id:101,name:"Mafuta Korie",price:12,img:"https://i.imgur.com/bI2cHtb.jpeg",
 imgs:[
   "https://i.imgur.com/g3hVvcA.jpeg",
   "https://i.imgur.com/b4T6KVn.jpeg",
   "https://i.imgur.com/DKQ0LxO.jpeg"
 ],type:"mafuta",desc:"Good cooking oil"},
 {id:102,name:"White T-Shirt",price:14,img:"https://i.imgur.com/F9T6D7U.jpeg",type:"tshirt"},
 {id:3,name:"Sukari 1kg",price:30,img:"https://i.imgur.com/1EFgnRl.jpeg",type:"sukari"},
 {id:5,name:"Chumvi",price:30,img:"https://i.imgur.com/e4CXmHr.jpeg/200",type:"sukari",desc:"chumvi bora"},
 {id:7,name:"Tomato sauce",price:20,img:"https://i.imgur.com/IqhRkL7.jpeg/200",type:"extra",desc:"Tomato sauce tamu"},
 {id:8,name:"Soy sauce",price:10,img:"https://i.imgur.com/CqraWiO.jpeg/200",type:"masala",desc:"Jipatie soy sauce"},
 {id:13,name:"Splash",price:12,img:"https://i.imgur.com/4ifKGQC.jpeg/200",type:"cream",desc:"Splash sweet flavour"},
 {id:14,name:"Bubble gum",price:15,img:"https://i.imgur.com/jJyMg1u.jpeg/200",type:"cream",desc:"Bubble gum flavoured ice lolly"},
 {id:15,name:"Ballcone",price:13,img:"https://i.imgur.com/YU7yVMc.jpeg/200",type:"cream",desc:"Ballcone flavoured ice cream"},
 {id:16,name:"Cherry",price:13,img:"https://i.imgur.com/Ax4J2uH.jpeg/200",type:"cream",desc:"Cherry flavoured ice lolly"},
 {id:17,name:"Cherry Bar",price:13,img:"https://i.imgur.com/QZ8B1VC.jpeg/200",type:"cream",desc:"Cherry flavoured ice bar"},
 {id:18,name:"Caramello",price:13,img:"https://i.imgur.com/HgeHJvR.jpeg/200",type:"cream",desc:"Caramello flavoured ice cream"},
 {id:11,name:"Coca Cola",price:23,img:"https://i.imgur.com/UYZ1dIH.jpeg/200",type:"drinks",desc:"Coca Cola"},
 {id:12,name:"pepsi",price:23,img:"https://i.imgur.com/cGRn5OZ.jpeg/200",type:"drinks",desc:"pepsi"},
 {id:31,name:"Afya Maji",price:23,img:"https://i.imgur.com/u9dkajs.jpeg/200",type:"drinks",desc:"Afya maji ya kunywa Baridi au Ya moto eka idadi HAPO chini"},
 {id:32,name:"u-fresh orange",price:23,img:"https://i.imgur.com/k42X2gl.jpeg/200",type:"drinks",desc:"u-fresh baridi ipo weka idadi hapo chini"},
 {id:33,name:"u-fresh power",price:23,img:"https://i.imgur.com/y1qJelw.jpeg/200",type:"drinks",desc:"u-fresh baridi ipo weka idadi hapo chini"},
 {id:34,name:"u-fresh pineapple",price:23,img:"https://i.imgur.com/GcVEME3.jpeg/200",type:"drinks",desc:"u-fresh baridi ipo weka idadi hapo chini"},
 {id:39,name:"u-fresh passion",price:20,img:"https://i.imgur.com/9uhn4hj.jpeg/200",type:"drinks",desc:"u-fresh baridi ipo weka idadi hapo chini"},
 {id:40,name:"u-fresh cola",price:21,img:"https://i.imgur.com/FvMtoAL.jpeg/200",type:"drinks",desc:"u-fresh baridi ipo weka idadi hapo chini"},
 {id:104,name:"Sneakers",price:40,img:"https://i.imgur.com/YU7yVMc.jpeg",type:"sneakers"}
];

localStorage.setItem("allProducts",JSON.stringify(fashion));

 function formatPrice(price){
  return "TZS " + Number(price).toLocaleString() + "/=";
}

function draw(list,id){
 document.getElementById(id).innerHTML=list.map(p=>`
  <div class="card" onclick="openProduct(${p.id})">
   <img src="${p.imgs ? p.imgs[0] : p.img}">
   <p>${p.name}</p>
   <b>${formatPrice(p.price)}</b>
  </div>`).join("");
}

draw(fashion.slice(0,2),"suggested");
draw(fashion.slice(1),"like");

function openType(t){
 localStorage.setItem("fashionType",t);
 location.href="fashion-list.html";
}

function openProduct(id){
 localStorage.setItem("pid",id);
 location.href="product.html";
}

function search(v){
 draw(fashion.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())),"suggested");
}
</script>

</body>
</html>
