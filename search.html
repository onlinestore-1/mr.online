<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 margin:0;
 font-family:Arial;
 background:#f4f4f4;
}

/* TOP SEARCH BAR */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 background:#2874f0;
 color:#fff;
}

.top input{
 flex:1;
 padding:10px;
 border:none;
 border-radius:20px;
}

/* SUGGESTIONS LIST */
.suggestions{
 background:#fff;
}

.item{
 display:flex;
 align-items:center;
 gap:10px;
 padding:10px;
 border-bottom:1px solid #eee;
 cursor:pointer;
}

.item img{
 width:40px;
 height:40px;
 object-fit:cover;
 border-radius:6px;
}

.item .text{
 flex:1;
}

.item .text p{
 margin:0;
 font-size:14px;
}

.item .text span{
 font-size:12px;
 color:#777;
}

.icon{
 color:#999;
}
</style>
</head>

<body>

<div class="top">
  <span onclick="history.back()">←</span>
  <input type="text" id="searchBox"
   placeholder="Search for Products, Brands and More"
   onkeyup="liveSearch(this.value)">
</div>

<div id="suggestions" class="suggestions"></div>

<script>

let products = JSON.parse(localStorage.getItem("allProducts")) || [];

/* 🔥 LIVE SEARCH */
function liveSearch(value){

 value = value.toLowerCase().trim();

 if(value === ""){
   document.getElementById("suggestions").innerHTML = "";
   return;
 }

 let result = products.filter(p =>
   p.name.toLowerCase().includes(value) ||
   p.type.toLowerCase().includes(value)
 );

 showSuggestions(result.slice(0,10)); // limit results
}

/* 🔥 SHOW SUGGESTIONS WITH IMAGE */
function showSuggestions(list){

 document.getElementById("suggestions").innerHTML =
  list.map(p=>`
   <div class="item" onclick="openResult('${p.type}')">

     <img src="${p.img}">

     <div class="text">
       <p>${p.name}</p>
       <span>in ${p.type}</span>
     </div>

     <div class="icon">↗</div>

   </div>
  `).join("");
}

/* 🔥 OPEN CATEGORY RESULT */
function openResult(type){
 localStorage.setItem("searchType", type);
 location.href = "results.html";
}

 function saveSearch(text){
 let history = JSON.parse(localStorage.getItem("searchHistory")) || [];
 history.unshift(text);
 history = [...new Set(history)].slice(0,5);
 localStorage.setItem("searchHistory", JSON.stringify(history));
}

</script>

</body>
</html>
