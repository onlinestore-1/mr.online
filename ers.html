<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f4f4f4;
  padding-top:60px;
  padding-bottom:70px;
}

/* TOP BAR */
.top-bar{
  position:fixed;
  top:0;
  width:100%;
  height:60px;
  background:#e6f2fb;
  display:flex;
  align-items:center;
  padding:0 10px;
  z-index:1000;
}

/* CARD */
.order-card{
  background:#fff;
  margin:10px;
  padding:10px;
  border-radius:6px;
}

/* FLEX */
.row{
  display:flex;
  gap:10px;
}

/* IMAGE */
.order-img{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:6px;
}

/* QTY */
.qty-box{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:5px;
}

.qty-box button{
  padding:5px 10px;
}

/* ACTIONS */
.actions{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #eee;
  margin-top:10px;
  padding-top:10px;
  font-size:14px;
}

.actions div{
  cursor:pointer;
}

.actions i{
  margin-right:5px;
}

/* NAV */
.bottom-nav{
 position:fixed;
 bottom:0;
 width:100%;
 height:60px;
 background:#fff;
 display:flex;
 justify-content:space-around;
 align-items:center;
 border-top:1px solid #ddd;
}

.bottom-nav a{
 text-decoration:none;
 text-align:center;
 font-size:12px;
 color:#777;
}

.bottom-nav i{
 display:block;
 font-size:20px;
}
</style>
</head>

<body>

<div class="top-bar">
  <i class="fa fa-arrow-left" onclick="history.back()"></i>
  <h3 style="margin-left:10px;">My Orders</h3>
</div>

<div id="ordersContainer"></div>

<script>
let orders = JSON.parse(localStorage.getItem("orders")) || [];

function formatPrice(p){
  return "TZS " + Number(p).toLocaleString() + "/=";
}

function displayOrders(){

  let container = document.getElementById("ordersContainer");

  if(orders.length === 0){
    container.innerHTML = "<p style='text-align:center'>No orders yet</p>";
    return;
  }

  container.innerHTML = "";

  orders.forEach((item,index)=>{

    container.innerHTML += `
    <div class="order-card">

      <div class="row">

        <!-- LEFT -->
        <div>
          <img src="${item.img}" class="order-img">

          <div class="qty-box">
            <button onclick="changeQty(${index},-1)">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty(${index},1)">+</button>
          </div>
        </div>

        <!-- RIGHT -->
        <div style="flex:1;">
          <b>${item.name}</b>
          
          ${item.size ? `<p>Size: ${item.size}</p>` : ""}

          <p>${formatPrice(item.price)}</p>
        </div>

      </div>

      <!-- ACTIONS -->
      <div class="actions">

        <div onclick="saveForLater(${index})">
          <i class="fa fa-bookmark"></i> Save
        </div>

        <div onclick="removeItem(${index})">
          <i class="fa fa-trash"></i> Remove
        </div>

        <div onclick="buyAgain(${index})">
          <i class="fa fa-bolt"></i> Buy again
        </div>

      </div>

    </div>
    `;
  });
}

/* CHANGE QTY */
function changeQty(i,change){
  orders[i].qty += change;

  if(orders[i].qty < 1){
    orders[i].qty = 1;
  }

  localStorage.setItem("orders", JSON.stringify(orders));
  displayOrders();
}

/* REMOVE */
function removeItem(i){
  orders.splice(i,1);
  localStorage.setItem("orders", JSON.stringify(orders));
  displayOrders();
}

/* SAVE FOR LATER */
function saveForLater(i){
  let saved = JSON.parse(localStorage.getItem("saved")) || [];
  saved.push(orders[i]);

  orders.splice(i,1);

  localStorage.setItem("saved", JSON.stringify(saved));
  localStorage.setItem("orders", JSON.stringify(orders));

  displayOrders();
}

/* BUY AGAIN */
function buyAgain(i){
  localStorage.setItem("buy", JSON.stringify(orders[i]));
  window.location.href = "checkout.html";
}

/* INIT */
displayOrders();
</script>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <a href="index.html">
    <i class="fa fa-home"></i>
    Home
  </a>

  <a href="category.html">
    <i class="fa fa-th-large"></i>
    Categories
  </a>

  <a href="account.html">
    <i class="fa fa-user"></i>
    Account
  </a>

  <a href="cart.html">
    <i class="fa fa-shopping-cart"></i>
    Cart
  </a>

</div>

</body>
</html>
