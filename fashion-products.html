<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>T-Shirts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#fff;padding:10px;border-radius:6px}
.card img{width:100%}
</style>
</head>

<body>

<h2 style="padding:10px">T-Shirts</h2>
<div class="grid" id="box"></div>

<script>
const tshirts = [
 {id:201,name:"Black T-Shirt",price:15,img:"https://i.imgur.com/b4T6KVn.jpeg",desc:"Cotton black T-shirt"},
 {id:202,name:"White T-Shirt",price:14,img:"https://i.imgur.com/F9T6D7U.jpeg",desc:"Plain white T-shirt"},
 {id:203,name:"Printed T-Shirt",price:18,img:"https://i.imgur.com/ZxZxZxZ.jpeg",desc:"Printed fashion tee"}
];

// SAVE to allProducts for product.html
localStorage.setItem("allProducts",JSON.stringify(tshirts));

document.getElementById("box").innerHTML = tshirts.map(p=>`
 <div class="card" onclick="openProduct(${p.id})">
  <img src="${p.img}">
  <p>${p.name}</p>
  <b>$${p.price}</b>
 </div>
`).join("");

function openProduct(id){
 localStorage.setItem("pid",id);
 location.href="product.html";
}
</script>

</body>
</html>
