<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f4f4;padding:15px}
.card{background:#fff;padding:15px;border-radius:6px}
button{width:100%;padding:10px;background:#2874f0;color:#fff;border:none}
input{width:100%;padding:8px;margin-bottom:10px}
</style>
</head>

<body>

<h2>Checkout</h2>
<div class="card" id="box"></div>

<script>
const item = JSON.parse(localStorage.getItem("buy"));

document.getElementById("box").innerHTML = `
 <p><b>${item.name}</b></p>
 <p>Price: $${item.price}</p>
 <p>Qty: ${item.qty}</p>
 <p>Total: $${item.price * item.qty}</p>

 <input placeholder="Full Name">
 <input placeholder="Phone Number">
 <input placeholder="Delivery Address">

 <button onclick="done()">Place Order</button>
`;

function done(){
 alert("Order placed successfully ✅");
 localStorage.removeItem("buy");
}
</script>

</body>
</html>
