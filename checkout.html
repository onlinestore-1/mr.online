<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Checkout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f4f4f4;padding:15px}
.card{background:#fff;padding:15px;border-radius:6px}
input,button{width:100%;padding:10px;margin-bottom:10px}
button{background:#2874f0;color:#fff;border:none}
</style>
</head>

<body>

<h2>Checkout</h2>
<div class="card">
<form action="https://formsubmit.co/YOUR_EMAIL_HERE" method="POST">

<input type="hidden" name="_subject" value="New Order">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<input name="name" placeholder="Full Name" required>
<input name="phone" placeholder="Phone Number" required>
<input name="address" placeholder="Delivery Address" required>

<textarea name="order" readonly id="order"></textarea>

<button type="submit">Place Order</button>
</form>
</div>

 <script>
const buy = JSON.parse(localStorage.getItem("buy"));

function formatPrice(price){
  return "TZS " + Number(price).toLocaleString() + "/=";
}

// BUILD ORDER TEXT
let orderText = `
${buy.name}
Price: ${formatPrice(buy.price)}
Qty: ${buy.qty}
`;

// ✅ ADD SIZE ONLY IF IT EXISTS
if(buy.size){
  orderText += `Size: ${buy.size}\n`;
}

// TOTAL
orderText += `Total: ${formatPrice(buy.price * buy.qty)}`;

// SHOW IN TEXTAREA
document.getElementById("order").value = orderText;
</script>

</body>
</html>
