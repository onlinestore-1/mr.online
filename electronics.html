<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eletronics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:Arial;background:#f4f4f4}

/* TOP */
.top{
 display:flex;
 align-items:center;
 gap:10px;
 background:#2874f0;
 padding:10px;
 color:#fff
}
.top input{flex:1;padding:8px;border:none;border-radius:4px}
.cart{font-size:22px;cursor:pointer}

/* SLIDER */
.slider img{width:100%;display:none}
.slider img:first-child{display:block}

/* CATEGORY GRID */
.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 padding:10px
}
.cat{
 background:#fff;
 padding:10px;
 text-align:center;
 border-radius:6px;
 cursor:pointer
}
.cat img{width:100%;height:90px;object-fit:cover}

/* PRODUCTS */
.grid2{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
 padding:10px
}
.card{
 background:#fff;
 padding:10px;
 border-radius:6px
}
.card img{width:100%}
</style>
</head>

<body>

<div class="top">
 <input type="search" placeholder="Search fashion..." onkeyup="search(this.value)">
 <span class="cart" onclick="location.href='cart.html'">🛒</span>
</div>

<!-- ADS -->
<div class="slider">
 <img src="https://i.imgur.com/j6JWI5n.png">
 <img src="https://i.imgur.com/3ZFgqAY.png">
 <img src="https://i.imgur.com/M4bTgH1.png">
</div>

<h3 style="padding:10px">Electronics Categories</h3>

<div class="grid3">
 <div class="cat" onclick="openType('laptop')"><img src="https://i.imgur.com/I9hTWkc.jpeg"><p>Laptops</p></div>
 <div class="cat" onclick="openType('charger')"><img src="https://i.imgur.com/lcHcjcc.jpeg"><p>Charger&Pods</p></div>
 <div class="cat" onclick="openType('pad')"><img src="https://i.imgur.com/fJEPZzT.jpeg"><p>Gaming pad</p></div>
 <div class="cat" onclick="openType('watches')"><img src="https://i.imgur.com/q8pRNyl.jpeg"><p>Watches</p></div>
 <div class="cat" onclick="openType('data')"><img src="https://i.imgur.com/sdP5Egk.jpeg"><p>Data storage</p></div>
 <div class="cat" onclick="openType('power')"><img src="https://i.imgur.com/8D9Bisb.jpeg"><p>Power Banks</p></div>
</div>

<h3 style="padding:10px">Suggested For You</h3>
<div class="grid2" id="suggested"></div>

<h3 style="padding:10px">You May Also Like</h3>
<div class="grid2" id="like"></div>

<script>
/* SLIDER */
let s=0;
setInterval(()=>{
 let imgs=document.querySelectorAll(".slider img");
 imgs.forEach(i=>i.style.display="none");
 s=(s+1)%imgs.length;
 imgs[s].style.display="block";
},3000);

/* FASHION DATA */
const fashion=[
 {id:101,name:"Smart Watches",price:12,img:"https://i.imgur.com/yIsxgJk.jpeg",type:"watches",desc:"Smart Watch for Men 50M Waterproof"},
 {id:102,name:"SanDisk",price:14,img:"https://i.imgur.com/p4TuNyK.jpeg",type:"data",desc:"SanDisk Ultra Shift 32GB"},
 {id:103,name:"Goboult",price:25,img:"https://i.imgur.com/d23TMP5.jpeg",type:"power",desc:"10000 mAH 22.5 W Power Bank"},
 {id:105,name:"PlayStation",price:25,img:"https://i.imgur.com/ADKZfyn.jpeg",type:"pad",desc:"PlayStation Sony dualShock 4 Wireless Controller"},
 {id:106,name:"HP Laptop",price:25,img:"https://i.imgur.com/Y5W6m6J.jpeg",type:"pad",desc:"HP ProBook 4530s 15.6 Laptop Notebook Intel i3"},
 {id:104,name:"Pods",price:40,img:"https://i.imgur.com/bSBbTan.jpeg",type:"charger",desc:"Swiss Pods Bluetooth Headset"}
];

localStorage.setItem("allProducts",JSON.stringify(fashion));

 function formatPrice(price){
  return "TZS " + Number(price).toLocaleString() + "/=";
}

function draw(list,id){
 document.getElementById(id).innerHTML=list.map(p=>`
  <div class="card" onclick="openProduct(${p.id})">
   <img src="${p.img}">
   <p>${p.name}</p>
   <b>${formatPrice(p.price)}</b>
  </div>`).join("");
}

draw(fashion.slice(0,2),"suggested");
draw(fashion.slice(1),"like");

function openType(t){
 localStorage.setItem("fashionType",t);
 location.href="fashion-list.html";
}

function openProduct(id){
 localStorage.setItem("pid",id);
 location.href="product.html";
}

function search(v){
 draw(fashion.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())),"suggested");
}
</script>

</body>
</html>
